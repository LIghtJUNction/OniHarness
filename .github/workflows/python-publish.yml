name: Publish Python library
on:
  push:
    tags: ['python-v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.15
      - name: Verify release tag
        run: |
          uv run python -c 'import os, tomllib; v=tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "python-v" + v'
      - run: uv run python -m unittest discover -s python/tests -v
      - run: uv run ruff check python/src python/tests examples/python
      - run: uv run mypy --python-version 3.10 python/src/oniharness
      - run: uv build --out-dir artifacts/python
      - run: uv run twine check artifacts/python/*
      - run: uv run python scripts/verify_python_distribution.py artifacts/python
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: artifacts/python/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/oniharness/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
