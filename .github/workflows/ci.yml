name: OniHarness verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  game-free:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            venv_python: ./.venv-runtime/bin/python
          - os: windows-latest
            venv_python: ./.venv-runtime/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Create isolated verification environment
        run: python -m venv .venv-runtime
      - name: Install hash-pinned verification dependencies
        run: ${{ matrix.venv_python }} -m pip install --require-hashes -r scripts/requirements-runtime.txt
      - name: Build, test, package and check distribution boundaries
        run: ${{ matrix.venv_python }} scripts/verify.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
