name: Python library
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} python -m unittest discover -s python/tests -v
      - run: uv run --python ${{ matrix.python }} ruff check python/src python/tests examples/python
      - run: uv run --python ${{ matrix.python }} mypy --python-version ${{ matrix.python }} python/src/oniharness
      - run: uv build --out-dir artifacts/python
      - run: uv run --python ${{ matrix.python }} twine check artifacts/python/*
      - run: uv run --python ${{ matrix.python }} python scripts/verify_python_distribution.py artifacts/python
